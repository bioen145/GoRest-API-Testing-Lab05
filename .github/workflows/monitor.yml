name: Production API Monitoring

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Create Monitor Collection and Execute Check
        run: |
          cat << 'EOF' > monitor_collection.json
          {
            "info": {
              "name": "GoRest API Monitor",
              "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
            },
            "item": [
              {
                "name": "GET Users Response Time Check",
                "request": {
                  "method": "GET",
                  "url": "https://gorest.co.in/public/v2/users"
                },
                "event": [
                  {
                    "listen": "test",
                    "script": {
                      "exec": [
                        "pm.test('Response time is below 2000ms', function () {",
                        "    pm.expect(pm.response.responseTime).to.be.below(2000);",
                        "});",
                        "pm.test('Status code is 200 OK', function () {",
                        "    pm.response.to.have.status(200);",
                        "});"
                      ],
                      "type": "text/javascript"
                    }
                  }
                ]
              }
            ]
          }
          EOF
          newman run monitor_collection.json
