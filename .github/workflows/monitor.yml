name: Production API Monitoring

on:
  schedule:
    - cron: '0 * * * *'  # Chạy tự động mỗi giờ
  workflow_dispatch:      # Kích hoạt thủ công

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Check API Response Time Below 800ms
        run: |
          newman run - --url "https://gorest.co.in/public/v2/users" \
            --test-script "pm.test('Response time is below 800ms', function () { pm.expect(pm.response.responseTime).to.be.below(800); }); pm.test('Status is 200 OK', function () { pm.response.to.have.status(200); });"
