name: GoRest API Automated Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Execute Newman Tests with CSV Data
        run: |
          newman run 2474802010279_NguyenMinhNhat_GoRest.postman_collection.json \
            -e 2474802010279_NguyenMinhNhat_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
